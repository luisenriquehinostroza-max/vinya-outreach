name: Vinya daily outreach

on:
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send ONE test email to this address (leave blank for normal run)"
        required: false
        default: ""

permissions:
  contents: write

concurrency: vinya-outreach

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List repository files
        run: ls -la

      - name: Send one test email
        if: ${{ github.event.inputs.test_email != '' }}
        run: python vinya_outreach.py test "${{ github.event.inputs.test_email }}"

      - name: Process STOP replies and bounces
        if: ${{ github.event.inputs.test_email == '' }}
        continue-on-error: true
        run: python vinya_outreach.py check-replies

      - name: Send today's batch (15)
        if: ${{ github.event.inputs.test_email == '' }}
        continue-on-error: true
        run: python vinya_outreach.py send

      - name: Show stats
        if: ${{ github.event.inputs.test_email == '' }}
        run: python vinya_outreach.py stats

      - name: Save logs to the repository
        if: always()
        run: |
          git config user.name "vinya-bot"
          git config user.email "luis@hinosinvestments.com"
          git add -A
          git diff --cached --quiet || git commit -m "Outreach log $(date -u +%F)"
          git push
